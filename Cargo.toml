[package]
name = "TerryWare"
version = "0.2.0"
edition = "2021"

[dependencies]
winreg = "0.55.0"
winapi = { version = "0.3.9", features = ["wincrypt", "memoryapi", "sysinfoapi", "winreg"] }
sha2 = "0.10.8"
rand = "0.9.0"
libaes = "0.7.0"
sysinfo = "0.33.1"
colored = "3.0.0"
windows = { version = "0.60.0", features = ["Win32_System_Memory"] }