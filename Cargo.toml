[package]
name = "TerryWare"
version = "0.2.0"
edition = "2021"

[dependencies] # Some of these dependencies aren't needed, working on anti-av code right now
winreg = "0.55.0"
winapi = { version = "0.3.9", features = [
    "wincrypt",
    "memoryapi", 
    "sysinfoapi",
    "winreg",
    "processthreadsapi",
    "tlhelp32",
    "handleapi",
    "debugapi",
    "winuser",
    "winnt"
]}
sha2 = "0.10.8"
rand = "0.9.0"
libaes = "0.7.0"
sysinfo = "0.33.1"
colored = "3.0.0"
windows = { version = "0.60.0", features = ["Win32_System_Memory"] }
scanflow = "0.2.1"
memflow = "0.2"